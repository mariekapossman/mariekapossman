<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Standstill</title>
  <style>
    /* BODY STYLES */
    body {
      background-color: lightgrey;
      color: black;
      font-family: Arial, sans-serif;
      line-height: 1.5;
      margin: 0;
      padding: 20px;
      text-align: center; /* centers inline content */
      position: relative; /* for absolute home arrow */
    }

    /* HOME LINK TOP-LEFT */
    .home-link {
      position: absolute;
      top: 20px;
      left: 20px;
      text-decoration: none;
      font-weight: bold;
      color: purple; /* arrow color */
    }

    /* FIGURE & FIGCAPTION */
    figure {
      margin: 60px auto 30px auto; /* center and spacing */
      max-width: 800px;
    }

    figcaption {
      text-align: center;
      font-size: 0.9em;
      margin-top: 10px;
      line-height: 1.3em;
    }

    /* MATERIALS LIST UNDER FIRST IMAGE */
    .materials {
      margin-bottom: 40px; /* extra spacing under the materials list */
      font-size: 0.9em;
      line-height: 1.4em;
    }

    /* IMAGES */
    img {
      display: block;
      max-width: 500px;       /* smaller image size */
      width: 100%;            /* responsive */
      height: auto;
      margin: 0 auto 20px auto; /* center and spacing below */
    }

    /* MULTIPLE IMAGES IN A ROW */
    .image-row {
      text-align: center;
      margin-bottom: 20px;
    }

    .image-row img {
      display: inline-block;
      max-width: 300px;
      margin: 0 10px 15px 10px;
      height: auto;
    }

  </style>
</head>
<body>
  <a href="index.html" class="home-link">&larr; home</a>

  <figure>
    <figcaption>
      Standstill
    </figcaption>

    <!-- First image -->
    <img src="Stanstill4web1.jpg" alt="Standstill 1">

    <!-- Materials / description with extra spacing -->
    <div class="materials">
      2025, quart cups, wet clay, cling wrap, cockroaches on the underside of a copper plate, natural repellant (cinnamon), hair
    </div>

    <!-- Other images -->
    <img src="DSCF5891 copy.jpeg" alt="Standstill 2">
    <img src="DSCF5993 copy.jpeg" alt="Standstill 3">
    <img src="DSCF5976 copy.jpeg" alt="Standstill 4">

    <figcaption>
      Additional installation shots.
    </figcaption>
  </figure>
</body>
</html>
