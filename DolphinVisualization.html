<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Dolphin Visualization</title>
  <style>
    /* BODY STYLES */
    body {
      background-color: lightgrey;
      color: black;
      font-family: Arial, sans-serif;
      line-height: 1.5;
      margin: 0;
      padding: 20px;
      text-align: center; /* centers text and inline content */
      position: relative; /* needed for absolute positioning of home link */
    }

    /* HOME LINK IN TOP LEFT */
    .home-link {
      position: absolute;
      top: 20px;
      left: 20px;
      text-decoration: none;
      color: grey;
      font-weight: bold;
    }

    /* FIGURE & FIGCAPTION */
    figure {
      margin: 60px auto 30px auto; /* centers figure and adds spacing */
      max-width: 800px;  /* prevents it from stretching too wide */
    }

    figcaption {
      text-align: center;
      font-size: 0.9em;
      margin-top: 10px;
      line-height: 1.3em;
    }

    /* IMAGES */
    img {
      display: block;
      margin: 0 auto 20px auto; /* centers images and adds space below */
      max-width: 600px;         /* controls max size */
      width: 100%;              /* responsive scaling */
      height: auto;
    }

  </style>
</head>
<body>
  <a href="index.html" class="home-link">&larr; home</a>

  <figure>
    <figcaption>
      Dolphin Visualization <br>
      cast glass, found glass, pleather, steel, clay, melon lard, melon skin and seeds, 8' x 3' x 2'
    </figcaption>

    <img src="InstallShot1.jpg" alt="Installation shot">
    <img src="dv7.jpg" alt="Dolphin Visualization">
    <img src="dolphin visualization detail-8.jpg" alt="DV4">
    <img src="dv17smaller.jpg" alt="DV17 smaller">
    <img src="dvsmaller39.jpg" alt="DV39">
    <img src="dvsmaller40.jpg" alt="DV40">
    <img src="dvsmaller41.jpg" alt="DV41">
    <img src="dvsmaller42.jpg" alt="DV42">

    <figcaption>
      Ear, 2025 <br>
      Cast glass cup (pate de verre) propped up by a curtain rod wrapped in pleather.
    </figcaption>

    <figcaption>
      Pin, 2025 <br>
      The back of my (mom’s) head, hair held by a spiraling pin. Melon lard spreading into the paper and secured to the wall with glass cane.
    </figcaption>
  </figure>
</body>
</html>
